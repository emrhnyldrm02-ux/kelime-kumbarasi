<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelime Kumbarası</title>
<script>
  // apply the saved theme before first paint so the page doesn't flash
  try { const t = localStorage.getItem('kelime-kumbarasi-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow column — header with counters, one-field add form, then list or quiz */
:root {
  --bg: #F5F7FB;
  --surface: #FFFFFF;
  --ink: #232733;
  --muted: #7E8599;
  --line: #E1E5EF;
  --accent: #3D6FD1;
  --accent-soft: #E6EDFB;
  --learned: #3E9A73;
  --learned-soft: #E1F2EA;
  --warn: #C2563A;
  --display: "Fredoka", "Nunito", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
/* Gece teması: "Otomatik" seçiliyken sistem ayarını izler, "Gece" seçiliyken her zaman */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171F; --surface: #1E2230; --ink: #ECEEF4; --muted: #98A0B5;
    --line: #313749; --accent: #7EA2F0; --accent-soft: #24304D;
    --learned: #6CC39C; --learned-soft: #1D3229; --warn: #F08C70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171F; --surface: #1E2230; --ink: #ECEEF4; --muted: #98A0B5;
  --line: #313749; --accent: #7EA2F0; --accent-soft: #24304D;
  --learned: #6CC39C; --learned-soft: #1D3229; --warn: #F08C70;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding: 28px 16px 56px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 22px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.6; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Header */
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 38px; height: 38px; flex: none; }
h1 { font-family: var(--display); font-weight: 600; font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat {
  display: inline-flex; align-items: baseline; gap: 5px;
  padding: 5px 11px; border-radius: 999px; background: var(--surface);
  border: 1px solid var(--line); font-size: 0.85rem; color: var(--muted);
}
.stat b { font-family: var(--display); font-weight: 600; font-size: 1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.head-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.theme { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.theme button {
  border: 0; background: transparent; border-radius: 999px; padding: 4px 10px;
  display: inline-flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: 600; color: var(--muted);
}
.theme button svg { width: 14px; height: 14px; }
.theme button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

/* Add form */
form.add {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; display: grid; gap: 10px;
}
.add-row { display: flex; gap: 10px; }
.add-row input { flex: 1; }
label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
input {
  width: 100%; min-width: 0; padding: 11px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg);
}
input::placeholder { color: var(--muted); }
input:focus { outline: none; border-color: var(--accent); }
.hint { font-size: 0.82rem; color: var(--muted); margin: 0; }
.hint.err { color: var(--warn); }
.btn {
  border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; white-space: nowrap;
  background: var(--accent); color: #fff;
}
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }

/* Tabs + filters */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tabs, .filters { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button, .filters button {
  border: 0; background: transparent; padding: 6px 14px; border-radius: 999px;
  font-weight: 600; font-size: 0.88rem; color: var(--muted);
}
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

/* Word list */
.list { display: grid; gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px 16px; display: grid; gap: 6px;
}
.card.learned { border-color: transparent; background: var(--learned-soft); }
.card.loading { border-style: dashed; }
.card-top { display: flex; align-items: center; gap: 8px; }
.en { font-family: var(--display); font-weight: 600; font-size: 1.25rem; min-width: 0; overflow-wrap: anywhere; }
.ipa { color: var(--muted); font-size: 0.88rem; }
.tr { font-weight: 600; overflow-wrap: anywhere; }
.ex { font-style: italic; font-size: 0.92rem; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: flex-start; }
.ex-tr { color: var(--muted); font-size: 0.86rem; overflow-wrap: anywhere; }
.thinking { color: var(--muted); font-size: 0.9rem; }
.actions { display: flex; gap: 6px; margin-left: auto; flex: none; }
.icon {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; color: var(--muted); padding: 0; flex: none;
}
.icon.sm { width: 26px; height: 26px; }
.icon svg { width: 16px; height: 16px; }
.icon.sm svg { width: 13px; height: 13px; }
.icon:hover { color: var(--ink); }
.icon.on { background: var(--learned); border-color: var(--learned); color: #fff; }
.icon.danger { color: var(--warn); border-color: var(--warn); }
.card .confirm { font-size: 0.8rem; color: var(--warn); font-weight: 700; }
.mine { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.list-count { margin: 0; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.btn.more { justify-self: center; }
#quizSource { justify-self: center; }
.card.editing { border-color: var(--accent); }
.edit-form { display: grid; gap: 8px; }
.edit-form label { display: grid; gap: 3px; font-size: 0.78rem; font-weight: 700; color: var(--muted); }
.edit-form input { padding: 8px 12px; font-weight: 400; color: var(--ink); }
.edit-btns { display: flex; gap: 8px; justify-content: flex-end; }
.edit-btns .btn { padding: 7px 16px; font-size: 0.88rem; }

.empty {
  text-align: center; padding: 34px 16px; color: var(--muted);
  border: 1.5px dashed var(--line); border-radius: var(--r);
}
.empty strong { display: block; color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 1.1rem; margin-bottom: 4px; }

/* Quiz */
.quiz { display: grid; gap: 14px; justify-items: center; }
.progress { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.flip { perspective: 1000px; width: 100%; max-width: 420px; aspect-ratio: 4 / 3; border: 0; background: none; padding: 0; }
.flip-inner {
  position: relative; width: 100%; height: 100%;
  transition: transform 0.5s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d;
}
.flip.turned .flip-inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 20px; background: var(--surface); border: 1px solid var(--line);
  display: grid; place-content: center; gap: 8px; text-align: center; padding: 20px;
}
.face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: transparent; }
.face .big { font-family: var(--display); font-weight: 600; font-size: clamp(1.6rem, 6vw, 2.3rem); overflow-wrap: anywhere; }
.face .small { color: var(--muted); font-size: 0.85rem; }
.quiz-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn.ok { background: var(--learned); }

/* Backup */
footer { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; align-items: center; }
footer .hint { width: 100%; text-align: center; }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 0.85rem; padding: 4px 8px; }

.toast {
  position: fixed; left: 50%; bottom: 20px;
  transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 16px; border-radius: 999px; font-size: 0.88rem; font-weight: 600;
  max-width: calc(100% - 32px); text-align: center;
}

/* Grammar */
.grammar { display: grid; gap: 16px; }
.g-head { display: grid; gap: 12px; }
.g-search { position: relative; }
.g-search input { padding-left: 38px; background: var(--surface); }
.g-search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.g-summary { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.g-summary .grow { flex: 1; }
.meter { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--learned); border-radius: 99px; }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.topic {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px 16px; display: grid; gap: 6px; align-content: start;
}
.topic:hover { border-color: var(--accent); }
.topic.done { background: var(--learned-soft); border-color: transparent; }
.topic h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.08rem; }
.topic .sub { color: var(--muted); font-size: 0.82rem; }
.topic .snip { font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }
.topic-foot { display: flex; gap: 8px; align-items: center; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { padding: 2px 9px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.chip.ok { background: var(--learned); color: #fff; }
.chip.bad { background: var(--warn); color: #fff; }
mark { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

.g-topic { display: grid; gap: 18px; }
.g-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.g-title h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.5rem; text-wrap: balance; }
.g-title .sub { color: var(--muted); }
.g-toc { display: flex; gap: 6px; flex-wrap: wrap; }
.g-toc button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.g-toc button:hover { color: var(--ink); border-color: var(--accent); }
.g-body { display: grid; gap: 14px; }
.g-sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; scroll-margin-top: 12px; }
.g-sec h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.12rem; color: var(--accent); }
.g-sec p { margin: 0; max-width: 68ch; }
.g-sec ul, .g-sec ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.g-ex { border-left: 3px solid var(--accent-soft); padding: 2px 0 2px 12px; display: grid; gap: 1px; }
.g-ex span[lang="en"] { font-weight: 600; }
.g-ex .g-tr { color: var(--muted); font-size: 0.9rem; }
.g-ex b, .g-sec p b, .g-sec li b { color: var(--accent); }
.g-table { overflow-x: auto; }
.g-table table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
.g-table th, .g-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.g-table th { font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.g-sec.basic { border: 2px solid var(--accent-soft); }
.g-sec.basic h3::before { content: "Sıfırdan · "; color: var(--muted); font-weight: 500; }
.g-formula {
  background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px;
  font-weight: 700; overflow-wrap: anywhere;
}
.g-formula small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }
.g-terms { display: grid; gap: 6px; margin: 0; }
.g-terms div { display: grid; grid-template-columns: minmax(90px, max-content) 1fr; gap: 10px; }
.g-terms dt { font-weight: 700; color: var(--accent); }
.g-terms dd { margin: 0; }
@media (max-width: 480px) { .g-terms div { grid-template-columns: 1fr; gap: 0; } }
.g-tips { background: var(--accent-soft); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 8px; }
.g-tips h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.g-tips ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

.qs { display: grid; gap: 12px; }
.qs-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qs-head h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.2rem; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.q-meta { font-size: 0.78rem; color: var(--muted); font-weight: 700; display: flex; gap: 8px; align-items: center; }
.q-text { margin: 0; font-weight: 600; }
.blank { display: inline-block; min-width: 3.5em; border-bottom: 2px solid var(--muted); margin: 0 2px; }
.q-opts { display: grid; gap: 6px; }
.q-opt {
  display: flex; gap: 10px; align-items: baseline; text-align: left;
  border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px;
}
.q-opt:hover:not(:disabled) { border-color: var(--accent); }
.q-opt:disabled { opacity: 1; }
.q-opt b { color: var(--muted); flex: none; }
.q-opt.right { background: var(--learned-soft); border-color: var(--learned); }
.q-opt.right b { color: var(--learned); }
.q-opt.wrong { border-color: var(--warn); }
.q-opt.wrong b { color: var(--warn); }
.q-exp { font-size: 0.9rem; border-radius: 10px; padding: 10px 12px; background: var(--bg); }
.q-exp strong { display: block; margin-bottom: 2px; }
.q-exp.ok strong { color: var(--learned); }
.q-exp.no strong { color: var(--warn); }

@media (prefers-reduced-motion: reduce) {
  .flip-inner { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <ellipse cx="20" cy="23" rx="15" ry="12" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>
        <rect x="15" y="9" width="10" height="3" rx="1.5" fill="var(--accent)"/>
        <circle cx="14" cy="21" r="1.6" fill="var(--ink)"/>
        <circle cx="26" cy="21" r="1.6" fill="var(--ink)"/>
        <ellipse cx="20" cy="26" rx="3.5" ry="2.4" fill="var(--accent)"/>
        <path d="M11 33 v3 M29 33 v3" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <h1>Kelime Kumbarası</h1>
    </div>
    <div class="head-right">
      <div class="stats">
        <span class="stat"><b id="sTotal">0</b> kelime</span>
        <span class="stat"><b id="sLearned">0</b> öğrenildi</span>
      </div>
      <div class="theme" id="themePick" role="group" aria-label="Renk teması">
        <button type="button" data-theme-set="light" title="Gündüz teması"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Gündüz</button>
        <button type="button" data-theme-set="dark" title="Gece teması"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>Gece</button>
        <button type="button" data-theme-set="auto" title="Bilgisayarın ayarına göre">Otomatik</button>
      </div>
    </div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <div class="add-row">
      <label class="sr" for="fEn">İngilizce kelime</label>
      <input id="fEn" placeholder="İngilizce bir kelime yaz, ör. cozy" required maxlength="80" lang="en" spellcheck="false">
      <button class="btn" type="submit" id="addBtn">Kumbaraya at</button>
    </div>
    <div class="add-row" id="manualRow" hidden>
      <label class="sr" for="fTr">Türkçe anlamı</label>
      <input id="fTr" placeholder="Türkçe anlamı" maxlength="160">
    </div>
    <p class="hint" id="addHint">Anlamı ve örnek cümlesi otomatik bulunur. İnternet bağlantısı gerekir.</p>
  </form>

  <div class="bar">
    <div class="tabs" role="group" aria-label="Görünüm">
      <button type="button" id="tabList" aria-pressed="true">Kelimelerim</button>
      <button type="button" id="tabQuiz" aria-pressed="false">Quiz</button>
      <button type="button" id="tabGrammar" aria-pressed="false">Gramer</button>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filtre">
      <button type="button" data-f="all" aria-pressed="true">Tümü</button>
      <button type="button" data-f="study" aria-pressed="false">Çalışılıyor</button>
      <button type="button" data-f="learned" aria-pressed="false">Öğrendim</button>
    </div>
  </div>

  <div class="g-search" id="wSearchWrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <label class="sr" for="wSearch">Kelimelerde ara</label>
    <input id="wSearch" type="search" placeholder="Kelimelerde ara (İngilizce ya da Türkçe)" autocomplete="off">
  </div>
  <section id="listView" class="list"></section>
  <section id="quizView" class="quiz" hidden></section>
  <section id="grammarView" class="grammar" hidden></section>

  <footer>
    <p class="hint">Kelimelerin ve gramer ilerlemen bu tarayıcıda saklanır. Ara sıra yedek almayı unutma.</p>
    <button class="link" type="button" id="exportBtn">Yedek indir</button>
    <button class="link" type="button" id="importBtn">Yedekten yükle</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<!-- YDS kelime bankası -->
<script>
window.WORD_BANK = [
["abandon", "terk etmek, vazgeçmek", "The crew had to abandon the sinking ship.", "Mürettebat batan gemiyi terk etmek zorunda kaldı."],
["abolish", "kaldırmak, yürürlükten kaldırmak", "Many countries have abolished the death penalty.", "Birçok ülke idam cezasını kaldırdı."],
["abrupt", "ani, beklenmedik", "The meeting came to an abrupt end.", "Toplantı ani bir şekilde sona erdi."],
["absence", "yokluk, bulunmama", "In the absence of evidence, the suspect was released.", "Kanıt yokluğunda şüpheli serbest bırakıldı."],
["absorb", "emmek, özümsemek", "Plants absorb carbon dioxide from the air.", "Bitkiler havadan karbondioksit emer."],
["abstract", "soyut", "Love is an abstract concept.", "Sevgi soyut bir kavramdır."],
["absurd", "saçma, anlamsız", "It is absurd to blame the children for the problem.", "Sorun için çocukları suçlamak saçma."],
["abundant", "bol, bereketli", "The region has abundant natural resources.", "Bölgede bol doğal kaynak var."],
["abuse", "kötüye kullanmak; istismar", "He was accused of abusing his power.", "Gücünü kötüye kullanmakla suçlandı."],
["academic", "akademik", "She has an excellent academic record.", "Mükemmel bir akademik geçmişi var."],

  tips: [

  sections: [

    { h: 'Zorunluluk, gereklilik ve yasak', html: `

    { h: 'Tavsiye, tercih ve izin', html: `
      ${L([

    { h: 'Geçmiş alışkanlık: used to, would', html: `

  tips: [

  questions: [

    { q: 'Some experts believe that the economic crisis ---- if governments had acted earlier.', o: ['could have been prevented', 'must be prevented', 'should prevent', 'may prevent', 'had to be prevented'], a: 0, e: '“if … had acted” 3. tip koşuldur; gerçekleşmemiş geçmiş olasılık → <b>could have been prevented</b>.' },
    { q: 'When I was a child, my grandfather ---- tell us stories about his years at sea.', o: ['would', 'was used to', 'must', 'should', 'is used to'], a: 0, e: 'Geçmişte tekrarlanan bir eylem → <b>would + V1</b>. “was used to” arkasından Ving ister.' },
    { q: 'Students ---- submit their assignments by Friday; late submissions will not be accepted.', o: ['must', 'needn\'t', 'might', 'could', 'would rather'], a: 0, e: 'Geç teslim kabul edilmiyorsa bu bir zorunluluktur → <b>must</b>.' },
    { q: 'The patient\'s condition is improving, so the doctors ---- operate after all.', o: ['may not have to', 'mustn\'t', 'can\'t have', 'shouldn\'t have', 'couldn\'t have'], a: 0, e: 'Durum iyileştiği için ameliyat gerekmeyebilir → olasılık + gereklilik yok: <b>may not have to</b>. “mustn\'t” yasak anlamı verir.' }

GRAMMAR.push({

    { h: 'If yerine kullanılan bağlaçlar', html: `

    intro: 'Sıfat cümleciği, bir ismi <b>tarif eden</b> küçük bir cümledir. Türkçedeki “dün <b>gördüğüm</b> adam”, “<b>kırmızı olan</b> araba” yapılarının karşılığıdır. İngilizcede bu tarif ismin <b>arkasına</b> gelir.',
    html: `
      <p>Türkçede tarif eden kısım ismin <b>önüne</b> gelir: “dün gördüğüm <b>adam</b>”. İngilizcede ise <b>arkasına</b> gelir ve araya <b>who / which / that</b> gibi bir bağlaç girer:</p>

      ${T(['Bağlaç', 'Ne için?', 'Örnek', 'Türkçesi'], [

        ['where', 'yer', 'the city <b>where</b> I was born', 'doğduğum şehir'],

      <p>Türkçeden İngilizceye çevirirken önce ismi söyle, sonra tarifi ekle: “doğduğum <b>şehir</b>” → “the <b>city</b> where I was born”.</p>`

  'adverbial-clauses': {
    intro: 'Zarf cümlecikleri iki olay arasındaki <b>ilişkiyi</b> anlatır: ne zaman oldu, neden oldu, neye rağmen oldu, ne amaçla yapıldı? Türkçedeki “gel<b>ince</b>, yağdığı <b>için</b>, yorgun olmasına <b>rağmen</b>” yapılarının karşılığıdır.',
    html: `

      ${T(['İlişki', 'Türkçe', 'İngilizce bağlaç'], [

      ${X('I was tired, <b>so</b> I went to bed. → I went to bed <b>because</b> I was tired.', 'Yorgundum, o yüzden yattım. → Yorgun olduğum için yattım.')}

      <p><b>Dikkat:</b> Bazı kelimeler cümle değil <b>isim</b> alır. “although” + cümle (although it rained), ama “despite” + isim (despite the rain). İkisi de “rağmen” demektir.</p>`
  },
  conjunctions: {
    intro: 'Bağlaçlar ve geçiş ifadeleri, cümleleri birbirine bağlayan <b>köprü kelimelerdir</b>: “ve, ama, bu yüzden, ayrıca, örneğin”. Okuduğun metni anlamanın anahtarı bu kelimelerdir.',

      ${T(['İlişki', 'Türkçe', 'İngilizce'], [

  'gerunds-infinitives': {
    intro: 'Bir fiil başka bir fiilin arkasına geldiğinde iki biçimden birini alır: <b>to + V1</b> (to swim) ya da <b>Ving</b> (swimming). Türkçedeki “yüz<b>mek</b>, yüz<b>meyi</b>, yüz<b>mekten</b>” yapılarının karşılığıdır.',
    html: `

      ${T(['Biçim', 'Adı', 'Örnek', 'Türkçesi'], [

      <p>Hangi fiilden sonra hangisinin geleceğini büyük ölçüde <b>ezberlemek</b> gerekir. Ama işini kolaylaştıran üç kural var:</p>
      <ol>
        <li><b>Edattan sonra her zaman Ving gelir:</b> interested <b>in learning</b>, good <b>at cooking</b>, <b>before leaving</b>.</li>

      ${X('She decided <b>to study</b> medicine.', 'Tıp okumaya karar verdi. (decide + to)')}

  reductions: {
    intro: 'Kısaltma, iki parçalı bir cümleyi <b>daha kısa</b> hale getirmektir. Türkçedeki “Eve <b>yürürken</b> …”, “Raporu <b>bitirince</b> …” gibi yapıların karşılığıdır. Akademik metinlerde çok sık kullanılır.',
    html: `

      ${X('<b>Walking</b> home, I saw an old friend.', 'Eve yürürken eski bir arkadaşımı gördüm. (kısa hali)')}
      <p>Türkçede de aynısını yaparız: “Ben eve yürürken ben gördüm” demeyiz, özneyi bir kez söyleriz. Kısaltmada fiil üç biçimden birini alır:</p>

      <p><b>Nasıl seçerim?</b> Virgülden sonraki cümlenin öznesine bak ve sor: “Bu özne işi yapıyor mu, yoksa ona mı yapılıyor?”</p>`
  },
  comparisons: {
    intro: 'Karşılaştırmalar iki ya da daha fazla şeyi kıyaslamak için kullanılır: “daha büyük”, “en büyük”, “…kadar büyük”. Türkçedeki <b>daha</b>, <b>en</b> ve <b>kadar</b> kelimelerinin karşılığıdır.',
    html: `

      ${T(['Türkçe', 'Kısa sıfat (big)', 'Uzun sıfat (expensive)'], [

        ['…kadar büyük', '<b>as</b> big <b>as</b>', '<b>as</b> expensive <b>as</b>']

      ${X('My house is <b>bigger than</b> yours.', 'Benim evim seninkinden daha büyük. (than = …den)')}

      ${X('Ali is <b>as tall as</b> his father.', 'Ali babası kadar uzun.')}

  },
  quantifiers: {
    intro: 'Miktar belirteçleri bir şeyin <b>ne kadar</b> ya da <b>kaç tane</b> olduğunu söyler: “çok, az, birkaç, her, hiç”. Hangisinin kullanılacağı, ismin sayılabilir olup olmamasına bağlıdır.',
    html: `
      <p>Önce ismi kontrol et: <b>tek tek sayabilir misin?</b> Elma sayılır (bir elma, iki elma); su sayılmaz (bir su, iki su denmez, “bir bardak su” denir).</p>
      ${T(['Türkçe', 'Sayılabilen ile (books)', 'Sayılamayan ile (water)'], [

        ['çok, bol (ikisiyle de)', 'a lot of books', 'a lot of water'],

      ${X('There are <b>many</b> students in the library.', 'Kütüphanede çok öğrenci var.')}
      ${X('I don\'t have <b>much</b> time.', 'Fazla vaktim yok.')}
      ${D([

        ['each / every', '“her” demektir; arkasından tekil isim gelir: every student.']

  },
  prepositions: {
    intro: 'Edatlar <b>in, on, at, for, with</b> gibi küçük kelimelerdir. Türkçede bu görevi çoğunlukla ekler yapar: ev<b>de</b>, okul<b>a</b>, sen<b>inle</b>. İngilizcede ise kelimenin önüne ayrı bir kelime gelir.',
    html: `
      <p>Türkçede “evde” deriz; İngilizcede “<b>at</b> home”. Yani Türkçedeki ek, İngilizcede ismin <b>önüne</b> gelen bir kelimeye dönüşür.</p>
      ${T(['Türkçe ek', 'İngilizce', 'Örnek'], [
        ['-de / -da (içinde)', 'in', '<b>in</b> the box (kutuda)'],
        ['-de / -da (üstünde)', 'on', '<b>on</b> the table (masada)'],

        ['-e / -a (yön)', 'to', 'go <b>to</b> school (okula gitmek)'],
        ['-den / -dan', 'from', '<b>from</b> Ankara (Ankara’dan)'],

      <p>Zaman için de üç temel edat vardır: <b>at</b> + saat (at 5), <b>on</b> + gün (on Monday), <b>in</b> + ay/yıl (in May, in 2020).</p>
      <p>YDS’de daha çok <b>kalıp</b> sorulur: bazı kelimeler belli bir edatla birlikte kullanılır ve bunlar ezberlenir. Örneğin “depend <b>on</b>” (…e bağlı olmak), “interested <b>in</b>” (…ile ilgilenmek). Bu kalıpları Kelimelerim sekmesine ekleyip çalışabilirsin.</p>`
  },
  pronouns: {
    intro: 'Zamirler, bir ismi tekrar tekrar söylemek yerine kullandığımız kelimelerdir: <b>ben, sen, o, onu, onun, kendisi</b>. Okuduğun metinde “it” ya da “they” neyi kastediyor, bunu bulmak YDS’de önemlidir.',
    html: `
      <p>“Ali geldi. Ali çok yorgundu.” demek yerine “Ali geldi. <b>O</b> çok yorgundu.” deriz. İngilizcede zamir, cümledeki görevine göre biçim değiştirir:</p>
      ${T(['Türkçe', 'Özne (o …)', 'Nesne (onu)', 'İyelik (onun …)', 'Kendisi'], [
        ['ben', 'I', 'me', 'my', 'myself'],
        ['sen', 'you', 'you', 'your', 'yourself'],
        ['o (erkek)', 'he', 'him', 'his', 'himself'],
        ['o (kadın)', 'she', 'her', 'her', 'herself'],
        ['o (şey, hayvan)', 'it', 'it', 'its', 'itself'],
        ['biz', 'we', 'us', 'our', 'ourselves'],
        ['onlar', 'they', 'them', 'their', 'themselves']
      ])}
      ${X('<b>She</b> loves <b>her</b> cat. The cat loves <b>her</b> too.', 'O kedisini seviyor. Kedi de onu seviyor.')}
      <p>Türkçede “o” erkek, kadın ve eşya için aynıdır. İngilizcede ayrıdır: erkek <b>he</b>, kadın <b>she</b>, eşya ve hayvan <b>it</b>.</p>`
  },
  causatives: {
    intro: 'Ettirgen yapı bir işi <b>başkasına yaptırmayı</b> anlatır. Türkçedeki “saçımı kes<b>tir</b>dim”, “arabamı yıka<b>t</b>tım” yapılarının karşılığıdır.',
    html: `
      <p>“Saçımı kestim” dersen saçını kendin kesmişsindir. “Saçımı kestirdim” dersen kuaföre kestirmişsindir. Türkçede bunu <b>-tir, -dir, -t</b> ekleriyle yaparız. İngilizcede ise <b>have</b> ya da <b>get</b> kullanırız:</p>
      ${F('have / get + nesne + V3', 'I had my hair cut. = Saçımı kestirdim.')}
      ${X('I <b>cut</b> my hair.', 'Saçımı (kendim) kestim.')}
      ${X('I <b>had</b> my hair <b>cut</b>.', 'Saçımı kestirdim. (kuaför kesti)')}
      ${X('We <b>got</b> our car <b>washed</b>.', 'Arabamızı yıkattık.')}
      <p>Bir de birini bir şey yapmaya <b>zorlamak</b> (make) ve bir şey yapmasına <b>izin vermek</b> (let) vardır:</p>
      ${X('My mother <b>made</b> me <b>clean</b> my room.', 'Annem bana odamı temizletti. (zorla)')}
      ${X('My father <b>let</b> me <b>drive</b> his car.', 'Babam arabasını sürmeme izin verdi.')}`
  },
  inversion: {
    intro: 'Devrik yapı, cümlenin normal sırasının <b>soru cümlesi gibi</b> ters çevrilmesidir. Genellikle “asla, nadiren, sadece” gibi vurgulu bir kelime cümlenin başına geldiğinde olur ve anlama güç katar.',
    html: `
      <p>Normal bir cümlede önce özne, sonra fiil gelir. Soru cümlesinde ise yardımcı fiil öne geçer:</p>

      ${X('I have <b>never</b> seen such a thing.', 'Hiç böyle bir şey görmedim. (normal)')}
      ${X('<b>Never have I</b> seen such a thing.', 'Asla böyle bir şey görmedim! (devrik, daha vurgulu)')}
      ${F('Olumsuz kelime + yardımcı fiil + özne + fiil', 'Never have I seen… / Rarely does he come…')}
      <p>Bu yapı günlük konuşmada az kullanılır ama YDS’deki resmi ve akademik metinlerde sık çıkar. Görünce şaşırmaman için kalıbı tanıman yeterli.</p>`

<script>
(() => {
  const $ = id => document.getElementById(id);
  const ICONS = {
    speak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>'
  };

  let words = [];          // the user's own words: {id, en, tr, ipa, audio, ex, exTr, learned, createdAt}
  let bankState = {};      // changes to built-in words, keyed by id: {learned, tr, ex, exTr, hidden}
  let pending = null;      // word being looked up: {en}
  let filter = 'all';
  let query = '';
  let view = 'list';
  let pendingDelete = null;
  let editingId = null;    // card whose meaning is being corrected
  const PAGE = 60;
  let shownCount = PAGE;

  // built-in YDS words: [en, tr, example, example in Turkish]
  const BANK = (window.WORD_BANK || []).map(([en, tr, ex, exTr]) => ({ id: 'b:' + en.toLowerCase(), en, tr, ex, exTr, bank: true }))
    .sort((a, b) => a.en.localeCompare(b.en, 'en'));
  const bankById = new Map(BANK.map(b => [b.id, b]));
  const withState = b => bankState[b.id] ? { ...b, ...bankState[b.id] } : b;
  // one list: own words newest first, then the built-in words A–Z
  function allWords() {
    return [...words.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)),
      ...BANK.map(withState).filter(w => !w.hidden)];
  }
  function findWord(id) { return bankById.has(id) ? withState(bankById.get(id)) : words.find(x => x.id === id); }
  function updateWord(id, patch) {
    if (bankById.has(id)) { bankState[id] = { ...bankState[id], ...patch }; persistBank(); }
    else { const w = words.find(x => x.id === id); if (w) { Object.assign(w, patch); persist(); } }
  }
  // an existing entry with the same English word, own or built-in (hidden ones included)
  function findByEn(en) {
    const k = en.trim().toLowerCase();
    return words.find(w => w.en.toLowerCase() === k) || (bankById.has('b:' + k) ? withState(bankById.get('b:' + k)) : null);
  }

  // ---------- storage ----------
  const LS_KEY = 'kelime-kumbarasi-words';
  const BANK_KEY = 'kelime-kumbarasi-bank';
  function load() {
    try { words = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { words = []; }
    try { bankState = JSON.parse(localStorage.getItem(BANK_KEY) || '{}') || {}; } catch { bankState = {}; }
  }
  function persist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(words)); }
    catch { toast('Kaydedilemedi. Tarayıcı depolamaya izin vermiyor olabilir.'); }
  }
  function persistBank() { try { localStorage.setItem(BANK_KEY, JSON.stringify(bankState)); } catch {} }

  // ---------- lookup: MyMemory for Turkish, Free Dictionary for example + audio ----------
  async function translate(text) {
    const r = await fetch('https://api.mymemory.translated.net/get?langpair=en|tr&q=' + encodeURIComponent(text));
    if (!r.ok) throw new Error('translate');
    return r.json();
  }
  async function dictionary(word) {
    try {
      const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.toLowerCase()));
      if (!r.ok) return null;
      const data = await r.json();
      return Array.isArray(data) ? data : null;
    } catch { return null; }
  }
  async function lookup(en) {
    const [tr, dict] = await Promise.all([translate(en), dictionary(en)]);

    // up to 3 distinct meanings, best matches first
    const key = en.toLowerCase();
    const seen = new Set(), meanings = [];
    const decoder = document.createElement('textarea');
    const add = t => {
      decoder.innerHTML = String(t || '');  // the service sometimes returns HTML entities like &#10;
      t = decoder.value.replace(/\s+/g, ' ').trim().replace(/[.!,;]+$/, '').trim();
      const k = t.toLocaleLowerCase('tr');
      if (!t || k === key || seen.has(k) || meanings.length >= 3) return;
      seen.add(k); meanings.push(t);
    };
    add(tr?.responseData?.translatedText);
    (tr?.matches || [])
      // extra meanings only from well-used, exact entries; one-off entries are often noise
      .filter(m => String(m.segment || '').trim().toLowerCase() === key && (m['usage-count'] || 0) >= 3 && (m.match || 0) >= 0.95)
      .sort((a, b) => (b.match || 0) - (a.match || 0))
      .forEach(m => add(m.translation));
    if (!meanings.length) throw new Error('no-meaning');

    let ipa = '', audio = '', ex = '';
    if (dict) {
      for (const entry of dict) {
        for (const p of entry.phonetics || []) {
          if (!audio && p.audio) audio = p.audio;
          if (!ipa && p.text) ipa = p.text;
        }
        if (!ipa && entry.phonetic) ipa = entry.phonetic;
        for (const m of entry.meanings || [])
          for (const d of m.definitions || [])
            if (!ex && d.example) ex = d.example;
      }
      // prefer the US recording when there are several
      const us = dict.flatMap(e => e.phonetics || []).find(p => /-us\.mp3$/.test(p.audio || ''));
      if (us) audio = us.audio;
    }
    let exTr = '';
    if (ex) { try { exTr = (await translate(ex))?.responseData?.translatedText || ''; } catch {} }

    return { en, tr: meanings.join(', '), ipa, audio, ex, exTr };
  }

  // ---------- base form: noticed → notice, went → go, studies → study ----------
  // irregular verbs as "base:form,form;…" plus a few irregular plurals
  const IRREGULAR = ('be:was,were,been,being,is,am,are;have:has,had,having;do:does,did,done,doing;go:goes,went,gone,going;'
    + 'say:says,said,saying;see:saw,seen,seeing;lie:lay,lain,lying;die:dying;tie:tying;arise:arose,arisen;awake:awoke,awoken;'
    + 'bear:bore,borne;beat:beaten;become:became;begin:began,begun;bend:bent;bet:betting;bind:bound;bite:bit,bitten;bleed:bled;'
    + 'blow:blew,blown;break:broke,broken;breed:bred;bring:brought;broadcast:broadcasting;build:built;burn:burnt;burst:bursting;'
    + 'buy:bought;catch:caught;choose:chose,chosen;cling:clung;come:came;cost:costing;creep:crept;cut:cutting;deal:dealt;dig:dug;'
    + 'draw:drew,drawn;dream:dreamt;drink:drank,drunk;drive:drove,driven;dwell:dwelt;eat:ate,eaten;fall:fell,fallen;feed:fed;'
    + 'feel:felt;fight:fought;find:found;flee:fled;fly:flew,flown,flies;forbid:forbade,forbidden;forecast:forecasting;forget:forgot,forgotten;'
    + 'forgive:forgave,forgiven;freeze:froze,frozen;get:got,gotten;give:gave,given;grind:ground;grow:grew,grown;hang:hung;hear:heard;'
    + 'hide:hid,hidden;hit:hitting;hold:held;hurt:hurting;keep:kept;kneel:knelt;know:knew,known;lay:laid;lead:led;lean:leant;leap:leapt;'
    + 'learn:learnt;leave:left;lend:lent;let:letting;light:lit;lose:lost;make:made;mean:meant;meet:met;mislead:misled;mistake:mistook,mistaken;'
    + 'overcome:overcame;overtake:overtook,overtaken;pay:paid;prove:proven;put:putting;quit:quitting;read:reading;ride:rode,ridden;'
    + 'ring:rang,rung;rise:rose,risen;run:ran,running;seek:sought;sell:sold;send:sent;set:setting;shake:shook,shaken;shine:shone;'
    + 'shoot:shot;show:shown;shrink:shrank,shrunk;shut:shutting;sing:sang,sung;sink:sank,sunk;sit:sat;sleep:slept;slide:slid;'
    + 'speak:spoke,spoken;speed:sped;spend:spent;spin:spun;split:splitting;spread:spreading;spring:sprang,sprung;stand:stood;steal:stole,stolen;'
    + 'stick:stuck;sting:stung;strike:struck;strive:strove,striven;swear:swore,sworn;sweep:swept;swim:swam,swum;swing:swung;take:took,taken;'
    + 'teach:taught;tear:tore,torn;tell:told;think:thought;throw:threw,thrown;understand:understood;undergo:underwent,undergone;'
    + 'undertake:undertook,undertaken;upset:upsetting;wake:woke,woken;wear:wore,worn;weep:wept;win:won;wind:wound;withdraw:withdrew,withdrawn;'
    + 'withstand:withstood;write:wrote,written;'
    + 'child:children;man:men;woman:women;person:people;foot:feet;tooth:teeth;mouse:mice;criterion:criteria;phenomenon:phenomena;'
    + 'analysis:analyses;crisis:crises;hypothesis:hypotheses;thesis:theses;basis:bases;diagnosis:diagnoses;medium:media;bacterium:bacteria;'
    + 'nucleus:nuclei;stimulus:stimuli;life:lives;wife:wives;knife:knives;leaf:leaves;half:halves;shelf:shelves;thief:thieves;wolf:wolves')
    .split(';').reduce((m, pair) => { const [base, forms] = pair.split(':'); forms.split(',').forEach(f => m[f] = base); return m; }, {});

  const VOWEL = /[aeiou]/;
  // words that only look inflected
  const KEEP_AS_IS = new Set(('news series species means physics economics mathematics politics statistics ethics athletics '
    + 'always perhaps towards afterwards whereas sometimes nowadays lens gas bus yes this his its was '
    + 'morning evening nothing something anything everything during ceiling building wedding pudding feeling meaning '
    + 'need seed speed breed feed proceed exceed succeed bed red shed hundred sacred naked wicked').split(' '));
  // possible base forms of a regular inflection, most likely first
  function lemmaCandidates(w) {
    const out = [];
    const undouble = s => (s.length > 2 && s.at(-1) === s.at(-2) && !/[aeiouwxy]/.test(s.at(-1))) ? s.slice(0, -1) : null;
    // "notic" → notice first; "sing", "watch" end in two consonants and rarely take an e
    const withE = base => (!VOWEL.test(base.at(-1)) && !VOWEL.test(base.at(-2))) ? [base, base + 'e'] : [base + 'e', base];
    if (KEEP_AS_IS.has(w)) return [];
    if (/ies$/.test(w) && w.length > 4) out.push(w.slice(0, -3) + 'y');
    else if (/ied$/.test(w) && w.length > 4) out.push(w.slice(0, -3) + 'y');
    else if (/ying$/.test(w) && w.length > 5) out.push(w.slice(0, -3));                      // studying → study
    else if (/ing$/.test(w) && w.length > 5) { const b = w.slice(0, -3); out.push(...withE(b), undouble(b)); }
    else if (/ed$/.test(w) && w.length > 4) { const b = w.slice(0, -2); out.push(w.slice(0, -1), b, undouble(b)); }
    else if (/(ss|us|is|ous)$/.test(w)) return [];                                             // class, status, analysis
    else if (/(ches|shes|sses|xes|zes|oes)$/.test(w)) out.push(w.slice(0, -1), w.slice(0, -2)); // watches, goes
    else if (/s$/.test(w) && w.length > 3) out.push(w.slice(0, -1));
    return [...new Set(out.filter(c => c && c.length > 1 && c !== w))];
  }
  async function wordExists(w) {
    try { const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(w)); if (r.ok) return true; }
    catch {}  // unknown words come back without CORS headers, so they land here too
    // second opinion when the dictionary is unreachable: a non-word comes back untranslated ("stopp" → "stopp")
    try {
      const t = String((await translate(w))?.responseData?.translatedText || '').trim().toLowerCase().replace(/[.!?]+$/, '');
      return !!t && t !== w;
    } catch { return false; }
  }
  // returns the base form, or the word itself when it is already a base form or nothing better is found
  async function baseForm(input) {
    const w = input.trim().toLowerCase();
    if (!/^[a-z]+$/.test(w)) return input.trim();          // phrases like "carry out" stay as typed
    if (findByEn(w)) return w;                              // already a known word as typed (data, underlying…)
    if (IRREGULAR[w]) return IRREGULAR[w];
    const cands = lemmaCandidates(w);
    const known = cands.find(c => findByEn(c));
    if (known) return known;
    for (const c of cands) if (await wordExists(c)) return c;
    return input.trim();
  }

  // ---------- English speech: real recording first, English voice second ----------
  let enVoice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      enVoice = vs.find(v => /^en[-_]US/i.test(v.lang) && /natural|online|google/i.test(v.name))
        || vs.find(v => /^en[-_]US/i.test(v.lang))
        || vs.find(v => /^en[-_]GB/i.test(v.lang))
        || vs.find(v => /^en/i.test(v.lang))
        || null;
    } catch {}
  }
  try { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch {}
  function speakTTS(text) {
    try {
      if (!enVoice) pickVoice();
      if (!enVoice) {
        toast('Cihazında İngilizce ses yüklü değil. Windows’ta: Ayarlar › Zaman ve dil › Konuşma › Ses ekle › English (United States).');
        return;
      }
      const u = new SpeechSynthesisUtterance(text);
      u.voice = enVoice; u.lang = enVoice.lang; u.rate = 0.9;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch { toast('Bu tarayıcı sesli okumayı desteklemiyor.'); }
  }
  function speak(text, audioUrl) {
    if (audioUrl) {
      const a = new Audio(audioUrl);
      a.play().catch(() => speakTTS(text));
    } else speakTTS(text);
  }

  // ---------- helpers ----------
  let toastT;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, Math.max(2400, msg.length * 55));
  }
  function hint(msg, err) { const h = $('addHint'); h.textContent = msg; h.classList.toggle('err', !!err); }
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // ---------- render ----------
  function render() {
    const all = allWords();
    $('sTotal').textContent = all.length.toLocaleString('tr');
    $('sLearned').textContent = all.filter(w => w.learned).length.toLocaleString('tr');
    $('listView').hidden = view !== 'list';
    $('wSearchWrap').hidden = view !== 'list';
    $('quizView').hidden = view !== 'quiz';
    $('grammarView').hidden = view !== 'grammar';
    $('addForm').hidden = view === 'grammar';
    $('filters').hidden = view !== 'list';
    if (view === 'list') renderList();
    if (view === 'grammar') renderGrammar();
  }

  function renderList() {
    const el = $('listView');
    const loading = pending ? `
      <article class="card loading">
        <div class="card-top"><span class="en" lang="en">${esc(pending.en)}</span></div>
        <div class="thinking">Anlamı ve örnek cümlesi aranıyor…</div>
      </article>` : '';
    const all = allWords();
    if (!all.length) {
      el.innerHTML = loading || '<div class="empty"><strong>Kumbaran henüz boş</strong>Yukarıya ilk İngilizce kelimeni yaz ve “Kumbaraya at”a bas.</div>';
      return;
    }
    const q = query.trim().toLocaleLowerCase('tr');
    const matches = all
      .filter(w => filter === 'all' || (filter === 'learned' ? w.learned : !w.learned))
      .filter(w => !q || w.en.toLowerCase().includes(q) || w.tr.toLocaleLowerCase('tr').includes(q));
    if (!matches.length) {
      el.innerHTML = loading + '<div class="empty">' + (q ? '“' + esc(query.trim()) + '” ile eşleşen kelime yok. Yukarıdan ekleyebilirsin.'
        : filter === 'learned' ? 'Henüz öğrendim olarak işaretlediğin kelime yok.' : 'Tebrikler, çalışılacak kelime kalmadı!') + '</div>';
      return;
    }
    const shown = matches.slice(0, shownCount);
    const rest = matches.length - shown.length;
    el.innerHTML = loading
      + `<p class="list-count">${matches.length.toLocaleString('tr')} kelime${q ? ' bulundu' : ''}</p>`
      + shown.map(w => w.id === editingId ? `
      <article class="card editing" data-id="${esc(w.id)}">
        <div class="card-top"><span class="en" lang="en">${esc(w.en)}</span></div>
        <div class="edit-form">
          <label for="eTr">Türkçe anlamı<input id="eTr" value="${esc(w.tr)}" maxlength="160"></label>
          <label for="eEx">Örnek cümle (İngilizce)<input id="eEx" value="${esc(w.ex)}" maxlength="240" lang="en"></label>
          <label for="eExTr">Örnek cümlenin Türkçesi<input id="eExTr" value="${esc(w.exTr)}" maxlength="240"></label>
          <div class="edit-btns">
            <button class="btn ghost" type="button" data-act="cancel">Vazgeç</button>
            <button class="btn" type="button" data-act="save">Kaydet</button>
          </div>
        </div>
      </article>` : `
      <article class="card${w.learned ? ' learned' : ''}" data-id="${esc(w.id)}">
        <div class="card-top">
          <span class="en" lang="en">${esc(w.en)}</span>
          ${w.ipa ? `<span class="ipa">${esc(w.ipa)}</span>` : ''}
          ${w.bank ? '' : '<span class="mine">eklediğim</span>'}
          <div class="actions">
            <button class="icon" data-act="speak" aria-label="${esc(w.en)} kelimesini dinle">${ICONS.speak}</button>
            <button class="icon" data-act="edit" aria-label="Anlamı düzelt">${ICONS.edit}</button>
            <button class="icon${w.learned ? ' on' : ''}" data-act="learn" aria-pressed="${!!w.learned}" aria-label="Öğrendim">${ICONS.check}</button>
            <button class="icon${pendingDelete === w.id ? ' danger' : ''}" data-act="del" aria-label="${pendingDelete === w.id ? 'Silmeyi onayla' : 'Sil'}">${ICONS.trash}</button>
          </div>
        </div>
        <div class="tr">${esc(w.tr)}</div>
        ${w.ex ? `<div class="ex" lang="en"><button class="icon sm" data-act="speakEx" aria-label="Örnek cümleyi dinle">${ICONS.speak}</button><span>“${esc(w.ex)}”</span></div>` : ''}
        ${w.exTr ? `<div class="ex-tr">${esc(w.exTr)}</div>` : ''}
        ${pendingDelete === w.id ? '<div class="confirm">Silmek için çöp kutusuna bir kez daha bas.</div>' : ''}
      </article>`).join('')
      + (rest ? `<button class="btn ghost more" type="button" id="moreBtn">Daha fazla göster (${rest.toLocaleString('tr')} kelime daha)</button>` : '');
    if (rest) $('moreBtn').onclick = () => { shownCount += PAGE * 2; render(); };
  }

  // ---------- quiz ----------
  const ROUND = 20;
  let deck = [], qi = 0, right = 0, turned = false;
  let quizSource = 'all';  // all | mine
  function quizPool() { return quizSource === 'mine' ? words.slice() : allWords(); }
  function startQuiz() {
    const pool = quizPool();
    const fresh = pool.filter(w => !w.learned);
    deck = (fresh.length ? fresh : pool).sort(() => Math.random() - 0.5).slice(0, ROUND);
    qi = 0; right = 0; turned = false;
    renderQuiz();
  }
  function renderQuiz() {
    const el = $('quizView');
    const source = `<div class="filters" id="quizSource" role="group" aria-label="Quiz kelimeleri">
        <button type="button" data-src="all" aria-pressed="${quizSource === 'all'}">Tüm kelimeler</button>
        <button type="button" data-src="mine" aria-pressed="${quizSource === 'mine'}">Eklediklerim</button>
      </div>`;
    const bindSource = () => $('quizSource').onclick = e => {
      const b = e.target.closest('[data-src]'); if (!b || b.dataset.src === quizSource) return;
      quizSource = b.dataset.src; startQuiz();
    };
    if (!deck.length) {
      el.innerHTML = source + '<div class="empty" style="width:100%"><strong>Quiz için kelime lazım</strong>Henüz kendi eklediğin kelime yok. Kelime ekle ya da “Tüm kelimeler”i seç.</div>';
      bindSource();
      return;
    }
    if (qi >= deck.length) {
      el.innerHTML = source + `<div class="empty" style="width:100%"><strong>${right} / ${deck.length} bildin</strong>${right === deck.length ? 'Harika, hepsini bildin!' : 'Bilmediklerini tekrar çalışabilirsin.'}</div>
        <button class="btn" id="qAgain">Yeni tur başlat</button>`;
      $('qAgain').onclick = startQuiz;
      bindSource();
      return;
    }
    const w = deck[qi];
    el.innerHTML = source + `
      <div class="progress">${qi + 1} / ${deck.length} · her turda rastgele ${ROUND} kelime</div>
      <button class="flip${turned ? ' turned' : ''}" id="qCard" aria-label="Kartı çevir">
        <div class="flip-inner">
          <div class="face"><div class="big" lang="en">${esc(w.en)}</div><div class="small">çevirmek için tıkla</div></div>
          <div class="face back"><div class="big">${esc(w.tr)}</div>${w.ex ? `<div class="small" lang="en">“${esc(w.ex)}”</div>` : ''}</div>
        </div>
      </button>
      <div class="quiz-btns">
        <button class="btn ghost" id="qSpeak">Dinle</button>
        ${turned ? '<button class="btn ghost" id="qNo">Bilemedim</button><button class="btn ok" id="qYes">Bildim</button>' : '<button class="btn" id="qTurn">Anlamı göster</button>'}
      </div>`;
    bindSource();
    const flip = () => { turned = !turned; renderQuiz(); };
    $('qCard').onclick = flip;
    $('qSpeak').onclick = () => speak(w.en, w.audio);
    if (turned) {
      $('qYes').onclick = () => { right++; qi++; turned = false; renderQuiz(); };
      $('qNo').onclick = () => { deck.push(w); qi++; turned = false; renderQuiz(); };
    } else $('qTurn').onclick = flip;
  }

  // ---------- events ----------
  const manual = () => !$('manualRow').hidden;
  let keepTypedOnce = null;  // set by "Hayır, … olarak ekle" to skip the base-form step once
  $('addForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (pending) return;
    const typed = $('fEn').value.trim();
    if (!typed) return;
    if (alreadyThere(typed)) return;
    const keepTyped = keepTypedOnce && keepTypedOnce.toLowerCase() === typed.toLowerCase();
    keepTypedOnce = null;

    // store the base form (noticed → notice) unless the user asked to keep what they typed
    let en = typed;
    if (!keepTyped) {
      pending = { en: typed }; $('addBtn').disabled = true;
      if (view !== 'list') setView('list'); else render();
      en = await baseForm(typed);
      pending = null; $('addBtn').disabled = false;
      if (en.toLowerCase() !== typed.toLowerCase() && alreadyThere(en, typed)) return;
    }

    let entry;
    if (manual() && $('fTr').value.trim()) {
      entry = { en, tr: $('fTr').value.trim(), ipa: '', audio: '', ex: '', exTr: '' };
    } else {
      pending = { en }; $('addBtn').disabled = true;
      if (view !== 'list') setView('list'); else render();
      try {
        entry = await lookup(en);
        hint('Anlamı ve örnek cümlesi otomatik bulunur. İnternet bağlantısı gerekir.');
      } catch {
        pending = null; $('addBtn').disabled = false; render();
        $('manualRow').hidden = false; $('fTr').focus();
        hint('Anlam bulunamadı. İnternetini kontrol et ya da anlamı kendin yazıp tekrar “Kumbaraya at”a bas.', true);
        return;
      }
      pending = null; $('addBtn').disabled = false;
      // the lookup may correct the spelling into a word that already exists
      if (alreadyThere(entry.en)) return;
    }

    const added = { id: newId(), ...entry, learned: false, createdAt: Date.now() };
    words.push(added);
    query = ''; $('wSearch').value = ''; shownCount = PAGE;
    persist(); render();
    $('addForm').reset(); $('manualRow').hidden = true; $('fEn').focus();
    if (added.en.toLowerCase() !== typed.toLowerCase()) {
      hint('“' + typed + '” kelimesini 1. hali olan “' + added.en + '” olarak ekledim.');
      // offer to undo, for words like "interesting" that are meant as they are
      const undo = document.createElement('button');
      undo.type = 'button'; undo.className = 'link'; undo.textContent = 'Hayır, “' + typed + '” olarak ekle';
      undo.onclick = () => {
        words = words.filter(x => x.id !== added.id); persist();
        keepTypedOnce = typed; $('fEn').value = typed;
        $('addForm').requestSubmit();
      };
      $('addHint').append(' ', undo);
    } else {
      hint('Anlamı ve örnek cümlesi otomatik bulunur. İnternet bağlantısı gerekir.');
    }
    toast('“' + added.en + '” kumbaraya eklendi');
  });

  // a word can be added only once; show the existing card instead
  function alreadyThere(en, typed) {
    const found = findByEn(en);
    if (!found) return false;
    if (found.hidden) updateWord(found.id, { hidden: false });
    const which = typed ? '“' + typed + '” kelimesinin 1. hali “' + found.en + '”, bu kelime' : '“' + found.en + '”';
    hint(which + ' zaten listende var' + (found.hidden ? ' (silmiştin, geri getirdim).' : '. Aşağıda gösteriliyor.'), true);
    query = found.en; $('wSearch').value = found.en;
    filter = 'all';
    document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', x.dataset.f === 'all'));
    shownCount = PAGE;
    if (view !== 'list') setView('list'); else render();
    return true;
  }

  $('listView').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const card = btn.closest('.card[data-id]'); if (!card) return;
    const id = card.dataset.id;
    const w = findWord(id); if (!w) return;
    const act = btn.dataset.act;
    if (act === 'speak') return speak(w.en, w.audio);
    if (act === 'speakEx') return speakTTS(w.ex);
    if (act === 'edit') { editingId = id; pendingDelete = null; render(); $('eTr').focus(); $('eTr').select(); return; }
    if (act === 'cancel') { editingId = null; render(); return; }
    if (act === 'save') return saveEdit(w);
    if (act === 'learn') { updateWord(id, { learned: !w.learned }); pendingDelete = null; render(); return; }
    if (act === 'del') {
      if (pendingDelete !== id) { pendingDelete = id; render(); return; }
      pendingDelete = null;
      if (w.bank) updateWord(id, { hidden: true });
      else { words = words.filter(x => x.id !== id); persist(); }
      render();
      toast('Silindi');
    }
  });

  function saveEdit(w) {
    const tr = $('eTr').value.trim();
    if (!tr) { toast('Anlam boş olamaz.'); $('eTr').focus(); return; }
    const ex = $('eEx').value.trim();
    updateWord(w.id, { tr, ex, exTr: ex ? $('eExTr').value.trim() : '' });
    editingId = null; render();
    toast('“' + w.en + '” güncellendi');
  }
  // Enter saves, Escape cancels while correcting a card
  $('listView').addEventListener('keydown', e => {
    if (!editingId || e.target.tagName !== 'INPUT') return;
    if (e.key === 'Enter') { e.preventDefault(); const w = findWord(editingId); if (w) saveEdit(w); }
    if (e.key === 'Escape') { editingId = null; render(); }
  });

  $('wSearch').addEventListener('input', () => {
    query = $('wSearch').value; shownCount = PAGE; editingId = null; pendingDelete = null; render();
  });

  $('filters').addEventListener('click', e => {
    const b = e.target.closest('button[data-f]'); if (!b) return;
    filter = b.dataset.f; shownCount = PAGE;
    document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });
  function setView(v) {
    view = v;
    $('tabList').setAttribute('aria-pressed', v === 'list');
    $('tabQuiz').setAttribute('aria-pressed', v === 'quiz');
    $('tabGrammar').setAttribute('aria-pressed', v === 'grammar');
    if (v === 'quiz') startQuiz();
    render();
  }
  $('tabList').onclick = () => setView('list');
  $('tabQuiz').onclick = () => setView('quiz');
  $('tabGrammar').onclick = () => { if (view === 'grammar') { gPage = 'home'; } setView('grammar'); };

  // ---------- grammar ----------
  const TOPICS = window.GRAMMAR || [];
  const GP_KEY = 'kelime-kumbarasi-grammar';
  let gp = { done: {}, ans: {} };   // ans[qid] = {ok, pick}
  let gPage = 'home';               // home | topic | wrong
  let gTopicId = null;
  let gQuery = '';
  let wrongIds = [];                // snapshot shown on the "Yanlışlarım" page
  const wrongPicks = {};            // answers given on that page this visit

  function loadGP() {
    try { const v = JSON.parse(localStorage.getItem(GP_KEY) || 'null'); if (v && v.done && v.ans) gp = v; } catch {}
  }
  function persistGP() { try { localStorage.setItem(GP_KEY, JSON.stringify(gp)); } catch {} }

  const SEARCH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  const LETTERS = 'ABCDE';
  const lower = s => s.toLocaleLowerCase('tr');
  const plain = html => html.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ');
  const qid = (t, i) => t.id + '-' + i;
  const findQ = id => {
    const cut = id.lastIndexOf('-');
    const t = TOPICS.find(x => x.id === id.slice(0, cut));
    return t ? { t, i: +id.slice(cut + 1), q: t.questions[+id.slice(cut + 1)] } : null;
  };
  // searchable text per topic, built once
  TOPICS.forEach(t => {
    t._text = lower([t.title, t.en, (t.keywords || []).join(' '), t.intro || '',
      ...t.sections.map(s => s.h + ' ' + plain(s.html)), ...(t.tips || []).map(plain)].join(' '));
  });
  function topicScore(t) {
    let right = 0, answered = 0;
    t.questions.forEach((_, i) => { const a = gp.ans[qid(t, i)]; if (a) { answered++; if (a.ok) right++; } });
    return { right, answered, total: t.questions.length };
  }
  const wrongList = () => Object.keys(gp.ans).filter(id => gp.ans[id].ok === false && findQ(id));

  function renderGrammar() {
    const el = $('grammarView');
    if (!TOPICS.length) { el.innerHTML = '<div class="empty">Gramer içeriği yüklenemedi.</div>'; return; }
    if (gPage === 'topic') return renderTopic(el);
    if (gPage === 'wrong') return renderWrong(el);

    const doneN = TOPICS.filter(t => gp.done[t.id]).length;
    const all = Object.values(gp.ans), rightN = all.filter(a => a.ok).length;
    const wrongN = wrongList().length;
    const q = lower(gQuery.trim());
    const shown = q ? TOPICS.filter(t => t._text.includes(q)) : TOPICS;

    el.innerHTML = `
      <div class="g-head">
        <div class="g-search">${SEARCH_ICON}
          <label class="sr" for="gSearch">Konularda ara</label>
          <input id="gSearch" type="search" placeholder="Konularda ara, ör. unless, since, by the time" value="${esc(gQuery)}">
        </div>
        <div class="g-summary">
          <span class="stat"><b>${doneN}/${TOPICS.length}</b> konu tamamlandı</span>
          <span class="stat"><b>${rightN}/${all.length}</b> doğru</span>
          <span class="grow"></span>
          <button class="btn ghost" type="button" id="gWrongBtn"${wrongN ? '' : ' disabled'}>Yanlışlarım (${wrongN})</button>
        </div>
        <div class="meter" aria-hidden="true"><i style="width:${Math.round(doneN / TOPICS.length * 100)}%"></i></div>
      </div>
      ${q && !shown.length ? `<div class="empty">“${esc(gQuery)}” hiçbir konuda geçmiyor.</div>` : ''}
      <div class="topics">
        ${shown.map(t => {
          const s = topicScore(t);
          let snip = '';
          if (q) {
            const body = plain([t.intro || '', ...t.sections.map(x => x.html)].join(' '));
            const at = lower(body).indexOf(q);
            if (at >= 0) {
              const from = Math.max(0, at - 40);
              snip = (from ? '…' : '') + esc(body.slice(from, at)) + '<mark>' + esc(body.slice(at, at + q.length)) + '</mark>' + esc(body.slice(at + q.length, at + q.length + 60)) + '…';
            }
          }
          return `<button type="button" class="topic${gp.done[t.id] ? ' done' : ''}" data-topic="${t.id}">
            <h3>${esc(t.title)}</h3>
            <span class="sub">${esc(t.en)}</span>
            ${snip ? `<span class="snip">${snip}</span>` : ''}
            <span class="topic-foot">
              ${gp.done[t.id] ? '<span class="chip ok">Tamamlandı</span>' : ''}
              <span>${t.sections.length} bölüm · ${s.answered ? s.right + '/' + s.total + ' doğru' : s.total + ' soru'}</span>
            </span>
          </button>`;
        }).join('')}
      </div>`;

    const input = $('gSearch');
    input.oninput = () => {
      gQuery = input.value;
      const pos = input.selectionStart;
      renderGrammar();
      const again = $('gSearch'); again.focus(); again.setSelectionRange(pos, pos);
    };
    $('gWrongBtn').onclick = () => {
      wrongIds = wrongList();
      for (const k in wrongPicks) delete wrongPicks[k];
      gPage = 'wrong'; renderGrammar(); window.scrollTo(0, 0);
    };
    el.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => openTopic(b.dataset.topic));
  }

  function openTopic(id) { gTopicId = id; gPage = 'topic'; renderGrammar(); window.scrollTo(0, 0); }

  function questionHTML(id, num, q, pick, topicLabel) {
    const answered = pick != null;
    return `<div class="q" data-qid="${id}">
      <div class="q-meta">Soru ${num}${topicLabel ? ' · ' + esc(topicLabel) : ''}${answered ? (pick === q.a ? ' <span class="chip ok">Doğru</span>' : ' <span class="chip bad">Yanlış</span>') : ''}</div>
      <p class="q-text" lang="en">${esc(q.q).replace(/-{4}/g, '<span class="blank" aria-label="boşluk"></span>')}</p>
      <div class="q-opts">
        ${q.o.map((o, i) => `<button type="button" class="q-opt${answered && i === q.a ? ' right' : ''}${answered && i === pick && pick !== q.a ? ' wrong' : ''}" data-pick="${i}"${answered ? ' disabled' : ''}><b>${LETTERS[i]})</b><span lang="en">${esc(o)}</span></button>`).join('')}
      </div>
      ${answered ? `<div class="q-exp ${pick === q.a ? 'ok' : 'no'}"><strong>${pick === q.a ? 'Doğru!' : 'Doğru cevap ' + LETTERS[q.a] + ')'}</strong>${q.e}</div>` : ''}
    </div>`;
  }

  function renderTopic(el) {
    const idx = TOPICS.findIndex(t => t.id === gTopicId);
    const t = TOPICS[idx];
    if (!t) { gPage = 'home'; return renderGrammar(); }
    const s = topicScore(t);
    const next = TOPICS[idx + 1];
    el.innerHTML = `
      <div class="g-topic">
        <div class="g-nav">
          <button class="btn ghost" type="button" id="gBack">← Konular</button>
          <button class="btn${gp.done[t.id] ? ' ok' : ' ghost'}" type="button" id="gDone" aria-pressed="${!!gp.done[t.id]}">${gp.done[t.id] ? '✓ Tamamlandı' : 'Konuyu tamamladım'}</button>
        </div>
        <div class="g-title"><h2>${esc(t.title)}</h2><span class="sub">${esc(t.en)}</span></div>
        ${t.intro ? `<p style="margin:0;max-width:68ch">${t.intro}</p>` : ''}
        <nav class="g-toc" aria-label="Bölümler">
          ${t.sections.map((x, i) => `<button type="button" data-jump="gs${i}">${esc(x.h)}</button>`).join('')}
          ${t.tips?.length ? '<button type="button" data-jump="gTips">YDS ipuçları</button>' : ''}
          <button type="button" data-jump="gQs">Sorular</button>
        </nav>
        <div class="g-body" id="gBody">
          ${t.sections.map((x, i) => `<section class="g-sec${x.basic ? ' basic' : ''}" id="gs${i}"><h3>${esc(x.h)}</h3>${x.html}</section>`).join('')}
          ${t.tips?.length ? `<section class="g-tips g-sec" id="gTips"><h3>YDS ipuçları ve tuzaklar</h3><ul>${t.tips.map(x => `<li>${x}</li>`).join('')}</ul></section>` : ''}
        </div>
        <section class="qs" id="gQs">
          <div class="qs-head">
            <h3>YDS tarzı sorular</h3>
            <span class="stat"><b>${s.right}/${s.total}</b> doğru</span>
            ${s.answered ? '<button class="link" type="button" id="gReset">Soruları baştan çöz</button>' : ''}
          </div>
          ${t.questions.map((q, i) => questionHTML(qid(t, i), i + 1, q, gp.ans[qid(t, i)]?.pick)).join('')}
        </section>
        <div class="g-nav">
          <button class="btn ghost" type="button" id="gBack2">← Konular</button>
          ${next ? `<button class="btn" type="button" id="gNext">Sonraki: ${esc(next.title)} →</button>` : ''}
        </div>
      </div>`;

    $('gBack').onclick = $('gBack2').onclick = () => { gPage = 'home'; renderGrammar(); window.scrollTo(0, 0); };
    if (next) $('gNext').onclick = () => openTopic(next.id);
    $('gDone').onclick = () => {
      if (gp.done[t.id]) delete gp.done[t.id]; else gp.done[t.id] = true;
      persistGP(); keepScroll(() => renderGrammar());
    };
    if ($('gReset')) $('gReset').onclick = () => {
      t.questions.forEach((_, i) => delete gp.ans[qid(t, i)]);
      persistGP(); keepScroll(() => renderGrammar());
    };
    el.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => $(b.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' }));
    el.querySelectorAll('.q').forEach(qEl => qEl.onclick = e => {
      const b = e.target.closest('[data-pick]'); if (!b || b.disabled) return;
      const id = qEl.dataset.qid, f = findQ(id), pick = +b.dataset.pick;
      gp.ans[id] = { ok: pick === f.q.a, pick };
      persistGP();
      qEl.outerHTML = questionHTML(id, f.i + 1, f.q, pick);
      const st = el.querySelector('.qs-head .stat b'); if (st) { const sc = topicScore(t); st.textContent = sc.right + '/' + sc.total; }
    });
    if (gQuery.trim()) highlight($('gBody'), gQuery.trim());
  }

  function renderWrong(el) {
    el.innerHTML = `
      <div class="g-nav">
        <button class="btn ghost" type="button" id="gBack">← Konular</button>
        <span class="hint">Doğru çözdüğün sorular listeden çıkar.</span>
      </div>
      <div class="qs-head"><h3>Yanlışlarım</h3></div>
      ${wrongIds.length ? '' : '<div class="empty"><strong>Yanlış sorun yok</strong>Konulardaki soruları çözdükçe yanlışların burada toplanır.</div>'}
      <div class="qs">
        ${wrongIds.map((id, n) => { const f = findQ(id); return questionHTML(id, n + 1, f.q, wrongPicks[id], f.t.title); }).join('')}
      </div>`;
    $('gBack').onclick = () => { gPage = 'home'; renderGrammar(); window.scrollTo(0, 0); };
    el.querySelectorAll('.q').forEach(qEl => qEl.onclick = e => {
      const b = e.target.closest('[data-pick]'); if (!b || b.disabled) return;
      const id = qEl.dataset.qid, f = findQ(id), pick = +b.dataset.pick;
      wrongPicks[id] = pick;
      gp.ans[id] = { ok: pick === f.q.a, pick };
      persistGP();
      qEl.outerHTML = questionHTML(id, wrongIds.indexOf(id) + 1, f.q, pick, f.t.title);
    });
  }

  function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

  // wrap search matches inside the topic body in <mark> and scroll to the first
  function highlight(root, term) {
    const needle = lower(term), hits = [];
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) if (lower(node.nodeValue).includes(needle)) hits.push(node);
    hits.forEach(n => {
      const text = n.nodeValue, low = lower(text), frag = document.createDocumentFragment();
      let i = 0, at;
      while ((at = low.indexOf(needle, i)) >= 0) {
        frag.append(text.slice(i, at));
        const m = document.createElement('mark'); m.textContent = text.slice(at, at + needle.length); frag.append(m);
        i = at + needle.length;
      }
      frag.append(text.slice(i));
      n.replaceWith(frag);
    });
    const first = root.querySelector('mark');
    if (first) setTimeout(() => first.scrollIntoView({ block: 'center' }), 0);
  }

  // ---------- backup ----------
  $('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify({ words, bank: bankState, grammar: gp }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kelime-kumbarasi-yedek-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      // older backups are a bare word array; newer ones also carry grammar progress
      const list = Array.isArray(data) ? data : data?.words;
      if (!Array.isArray(list)) throw 0;
      if (data.grammar?.done && data.grammar?.ans) {
        Object.assign(gp.done, data.grammar.done);
        Object.assign(gp.ans, data.grammar.ans);
        persistGP();
      }
      if (data.bank && typeof data.bank === 'object') { Object.assign(bankState, data.bank); persistBank(); }
      let added = 0;
      for (const w of list) {
        if (!w || typeof w.en !== 'string' || typeof w.tr !== 'string' || findByEn(w.en)) continue;
        words.push({ ...w, id: w.id || newId(), createdAt: w.createdAt || Date.now() });
        added++;
      }
      persist(); render();
      toast(added ? added + ' kelime yedekten eklendi' : 'Yedekte yeni kelime yoktu');
    } catch { toast('Bu dosya bir Kelime Kumbarası yedeği değil.'); }
  };

  // ---------- theme ----------
  const THEME_KEY = 'kelime-kumbarasi-theme';
  function applyTheme(mode) {
    if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
    else delete document.documentElement.dataset.theme;
    document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === mode));
  }
  let themeMode = 'auto';
  try { themeMode = localStorage.getItem(THEME_KEY) || 'auto'; } catch {}
  applyTheme(themeMode);
  $('themePick').addEventListener('click', e => {
    const b = e.target.closest('[data-theme-set]'); if (!b) return;
    themeMode = b.dataset.themeSet;
    try { localStorage.setItem(THEME_KEY, themeMode); } catch {}
    applyTheme(themeMode);
  });

  load();
  loadGP();
  render();
})();
</script>
</body>
</html>
